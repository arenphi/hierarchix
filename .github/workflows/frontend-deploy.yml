name: Deploy Frontend & Static Assets to Cloudflare Pages

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy-frontend:
    name: Build & Deploy Assets to Cloudflare Pages
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci || npm install

      - name: 🚀 Build Frontend Assets (Vite & Tailwind)
        run: npm run build

      - name: ☁️ Deploy Static Assets to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=spk-ahp-frontend --branch=${{ github.ref_name }}

